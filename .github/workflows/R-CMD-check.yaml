name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            r: release
            manual: true
            check-args: 'c("--as-cran")'
            extra-packages: "any::rcmdcheck any::haven any::units any::bit64"
            extended-audits: true
          - os: ubuntu-latest
            r: devel
            manual: false
            check-args: 'c("--no-manual", "--as-cran")'
            http-user-agent: release
            extra-packages: "any::rcmdcheck"
          - os: ubuntu-latest
            r: oldrel-1
            manual: false
            check-args: 'c("--no-manual", "--as-cran")'
            extra-packages: "any::rcmdcheck"
          - os: windows-latest
            r: release
            manual: false
            check-args: 'c("--no-manual", "--as-cran")'
            extra-packages: "any::rcmdcheck"
          - os: macos-latest
            r: release
            manual: false
            check-args: 'c("--no-manual", "--as-cran")'
            extra-packages: "any::rcmdcheck knitr=?source xfun=?source"

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual

      - name: Install HTML validation tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tidy

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ matrix.config.extra-packages }}
          needs: check

      - name: Check executable cleaning example
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          source("docs/open-data-cleaning.R", encoding = "UTF-8")
          source("docs/batch-stability.R", encoding = "UTF-8")
          source("docs/csv-cleaning.R", encoding = "UTF-8")
          source("docs/diagnostic-workflow.R", encoding = "UTF-8")
          source("inst/examples/chunked-cleaning.R", encoding = "UTF-8")
          source("docs/readme-audit.R", encoding = "UTF-8")
          source("docs/salary-adapter-audit.R", encoding = "UTF-8")

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.check-args }}

      - name: Check installed-package consistency and imported types
        if: matrix.config.extended-audits
        timeout-minutes: 15
        shell: Rscript {0}
        run: |
          # Audit an independent installation, rather than pkgload's dev namespace.
          lib <- tempfile("cncleanr-audit-library-")
          dir.create(lib)
          status <- system2(file.path(R.home("bin"), "R"),
            c("CMD", "INSTALL", paste0("--library=", shQuote(lib)), "."))
          stopifnot(status == 0L)
          for (package in c("haven", "units", "bit64"))
            stopifnot(requireNamespace(package, quietly = TRUE))
          scripts <- c("docs/system-audit.R", "docs/import-types-audit.R")
          for (script in scripts) {
            status <- system2(file.path(R.home("bin"), "Rscript"),
              c(shQuote(script), shQuote(lib), shQuote(.libPaths()[1L])))
            if (status != 0L) stop("Installed-package audit failed: ", script)
          }
          # Small source-derived cases are offline; full snapshots stay local.
          status <- system2(file.path(R.home("bin"), "Rscript"),
            c("docs/business-validation.R", shQuote(lib),
              "docs/fixtures/business-cases.csv", shQuote(tempfile("cncleanr-business-"))))
          if (status != 0L) stop("Business import/review/export audit failed")
