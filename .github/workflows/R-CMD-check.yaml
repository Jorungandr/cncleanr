name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release, extra-packages: "any::rcmdcheck"}
          - {os: ubuntu-latest, r: devel, http-user-agent: release, extra-packages: "any::rcmdcheck"}
          - {os: ubuntu-latest, r: oldrel-1, extra-packages: "any::rcmdcheck"}
          - {os: windows-latest, r: release, extra-packages: "any::rcmdcheck"}
          - {os: macos-latest, r: release, extra-packages: "any::rcmdcheck knitr=?source xfun=?source"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ matrix.config.extra-packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
